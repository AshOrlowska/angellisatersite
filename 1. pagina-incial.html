<!DOCTYPE html>
<html class="dark" lang="pt">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Angellis Ater - Página Inicial</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

  <!-- Configuração Tailwind -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f20d0d",
            "background-light": "#f8f5f5",
            "background-dark": "#110808",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"],
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
        },
      },
    }
  </script>

  <!-- Carregar fonte NOSFERATU -->
  <style>
    @font-face {
      font-family: 'Nosferatu';
      src: url('/fonts/Nosferatu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* Classe para Tailwind usar a fonte */
    .font-nosferatu {
      font-family: 'Nosferatu', serif !important;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-white antialiased">

<div class="relative flex min-h-screen w-full flex-col">

<!-- Top Navigation Bar -->
<header class="absolute top-0 z-10 w-full px-4 sm:px-10 py-5">
  <div class="mx-auto flex max-w-7xl items-center justify-between">
    <div class="flex items-center gap-3">
      <svg class="h-6 w-6 text-primary" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
      </svg>
      <h2 class="text-xl font-bold tracking-tight text-white">Angellis Ater</h2>
    </div>
    <nav class="hidden items-center gap-8 md:flex">
      <a class="text-sm font-medium text-white/80 transition-colors hover:text-white" href="#">BIOGRAFIA</a>
      <a class="text-sm font-medium text-white/80 transition-colors hover:text-white" href="#">DISCOGRAFIA</a>
      <a class="text-sm font-medium text-white/80 transition-colors hover:text-white" href="#">SHOWS</a>
      <a class="text-sm font-medium text-white/80 transition-colors hover:text-white" href="#">LOJA</a>
    </nav>
  </div>
</header>

<main class="flex-grow">

<!-- Hero Section -->
<div class="relative flex h-screen w-full flex-col items-center justify-center p-4">

  <div class="absolute inset-0 bg-cover bg-center" 
       style="background-image: linear-gradient(rgba(17, 8, 8, 0.6) 0%, rgba(17, 8, 8, 1) 100%), url('/imagens/logo.png');">
  </div>

  <div class="relative z-[5] flex flex-col items-center gap-6 text-center">

    <!-- TÍTULO COM A FONTE NOSFERATU -->
    <h1 class="font-nosferatu text-5xl tracking-tighter text-white md:text-7xl lg:text-8xl">
      Angellis Ater
    </h1>

    <h2 class="max-w-md text-base font-normal text-white/70 md:text-lg">
      Bem-vindo a Grande Queda. Explore a nossa discografia e veja as próximas datas de shows.
    </h2>

    <div class="mt-4 flex flex-col gap-3 sm:flex-row">
      <button class="flex min-w-[160px] cursor-pointer items-center justify-center rounded bg-primary px-5 py-3 text-base font-bold text-white transition-colors hover:bg-primary/90">
        Ver Discografia
      </button>
      <button class="flex min-w-[160px] cursor-pointer items-center justify-center rounded border border-white/20 bg-white/5 px-5 py-3 text-base font-bold text-white transition-colors hover:bg-white/10">
        Próximos Shows
      </button>
    </div>

  </div>
</div>

</main>

<!-- Footer -->
<footer class="w-full border-t border-white/10 bg-background-dark py-8 px-4 sm:px-10">
  <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-6 text-center sm:flex-row">
    <p class="text-sm text-white/50">© 2024 Angellis Ater. Todos os direitos reservados.</p>
    <div class="flex items-center gap-4">
      <a class="text-white/50 transition-colors hover:text-primary" href="#">
        <span class="material-symbols-outlined"> music_note </span>
      </a>
      <a class="text-white/50 transition-colors hover:text-primary" href="#">
        <span class="material-symbols-outlined"> play_circle </span>
      </a>
      <a class="text-white/50 transition-colors hover:text-primary" href="#">
        <span class="material-symbols-outlined"> photo_camera </span>
      </a>
    </div>
  </div>
</footer>

</div>

</body>
</html>
